# Publica os posts da fila na hora marcada (Brasília, UTC-3). O post que vence nas próximas
# 4 horas espera a hora e sai; o que chega atrasado sai na rodada seguinte, até 3 horas depois.
# O agendador do GitHub roda este workflow só umas 4 a 6 vezes por dia, a cada ~3 h, não importa
# quantos horários o cron pede (medido de 13 a 20/10). Por isso a espera é longa: a rodada da tarde
# fica aguardando as 19h. O repositório é público desde 20/10 para os minutos do Actions não terem
# limite. Os horários pedidos abaixo continuam, porque mais pedidos não atrapalham.
name: publicar

on:
  schedule:
    - cron: "*/5 21,22 * * *"
    - cron: "37 0,1,12-20,23 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar (o que vence agora) ou checar (confere tudo sem publicar)"
        type: choice
        options: [publicar, checar]
        default: checar

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publicar ou checar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MODO: ${{ github.event.inputs.modo }}
        run: |
          if [ "$MODO" = "checar" ]; then
            python publicar.py --checar
          else
            python publicar.py
          fi
