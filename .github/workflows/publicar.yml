# Publica os posts da fila na hora marcada (Brasília, UTC-3). O post que vence nos próximos
# 30 minutos espera a hora e sai; o que chega atrasado sai na rodada seguinte, até 3 horas depois.
# O agendador do GitHub pula rodadas em repositório pouco ativo (em 17 e 18/10 rodou a cada ~3 h),
# então o horário das 19h, o do feed, tem rodada a cada 5 minutos das 18h às 19h55. No resto do dia,
# de hora em hora no minuto 37, que foge da virada da hora.
name: publicar

on:
  schedule:
    - cron: "*/5 21,22 * * *"
    - cron: "37 0,1,12-20,23 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar (o que vence agora) ou checar (confere tudo sem publicar)"
        type: choice
        options: [publicar, checar]
        default: checar

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publicar ou checar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MODO: ${{ github.event.inputs.modo }}
        run: |
          if [ "$MODO" = "checar" ]; then
            python publicar.py --checar
          else
            python publicar.py
          fi
